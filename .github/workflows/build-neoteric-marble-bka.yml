name: Neoteric marble bka squeezed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Baseline disk
        run: |
          df -h
          echo
          free -h

      - name: Slim cleanup sem LVM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h

      - name: Choose build dir
        run: |
          MNT_FREE=$(df --block-size=1G --output=avail /mnt 2>/dev/null | tail -1 | tr -d ' ' || echo 0)
          ROOT_FREE=$(df --block-size=1G --output=avail / | tail -1 | tr -d ' ')
          MNT_DEV=$(stat -c %d /mnt 2>/dev/null || echo none)
          ROOT_DEV=$(stat -c %d /)
          if [ "$MNT_DEV" != "none" ] && [ "$MNT_DEV" != "$ROOT_DEV" ] && [ "$MNT_FREE" -ge 60 ]; then BASE=/mnt; else BASE="$GITHUB_WORKSPACE"; fi
          echo "BUILD_BASE=$BASE" >> $GITHUB_ENV
          echo "BASE=$BASE MNT_FREE=$MNT_FREE ROOT_FREE=$ROOT_FREE"
          mkdir -p "$BASE/rom" "$BASE/ccache"
          df -h "$BASE"

      - name: Deps + repo + swap
        run: |
          df -h "$BUILD_BASE"
          sudo apt-get update -y
          sudo apt-get install -y git git-lfs python3 curl ccache rsync zip
          git lfs install
          sudo curl --create-dirs -L -o /usr/local/bin/repo -O -L https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo
          sudo apt-get clean
          sudo fallocate -l 12G "$BUILD_BASE/swapfile" || sudo dd if=/dev/zero of="$BUILD_BASE/swapfile" bs=1M count=12288
          sudo chmod 600 "$BUILD_BASE/swapfile"
          sudo mkswap "$BUILD_BASE/swapfile"
          sudo swapon "$BUILD_BASE/swapfile"
          free -h
          df -h "$BUILD_BASE"
          java -version || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_BASE }}/ccache
          key: ccache-bka-marble-${github.run_number}
          restore-keys: |
            ccache-bka-marble-

      - name: Sync bka + marble.xml (shallow)
        run: |
          cd "$BUILD_BASE/rom"
          repo init --depth=1 -u https://github.com/neoteric-shadedark/android_manifest -b bka --git-lfs -g all
          repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
          df -h "$BUILD_BASE"
          rm -rf .repo/projects .repo/project-objects || true
          df -h "$BUILD_BASE"

      - name: Build neoteric_marble
        run: |
          cd "$BUILD_BASE/rom"
          export USE_CCACHE=1
          export CCACHE_DIR="$BUILD_BASE/ccache"
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=5G
          ccache -M 5G || true
          ccache -z || true
          source build/envsetup.sh
          lunch neoteric_marble-userdebug || lunch marble-userdebug
          mka bacon -j$(nproc --all)
          ccache -s || true
          ls -lh out/target/product/marble/*.zip

      - name: Upload zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoteric-marble
          path: ${{ env.BUILD_BASE }}/rom/out/target/product/marble/*.zip
          if-no-files-found: error

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marble-bka-${{ github.run_number }}
          files: ${{ env.BUILD_BASE }}/rom/out/target/product/marble/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
